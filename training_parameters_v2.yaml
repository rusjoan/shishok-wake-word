# v2: stronger adversarial pressure to reduce false accepts on near-words.
window_step_ms: 10

train_dir: "trained_models/wakeword_v2"

features:
  - features_dir: "generated_augmented_features"
    sampling_weight: 3.0
    penalty_weight: 1.0
    truth: True
    truncation_strategy: "truncate_start"
    type: "mmap"
  - features_dir: "negative_datasets/dinner_party"
    sampling_weight: 8.0
    penalty_weight: 1.0
    truth: False
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "negative_datasets/no_speech"
    sampling_weight: 4.0
    penalty_weight: 1.0
    truth: False
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "cv_ru_speech"
    sampling_weight: 8.0
    penalty_weight: 1.0
    truth: False
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "adversarial_features"
    sampling_weight: 6.0
    penalty_weight: 2.0
    truth: False
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "negative_datasets/dinner_party_eval"
    sampling_weight: 0.0
    penalty_weight: 1.0
    truth: False
    truncation_strategy: "split"
    type: "mmap"

training_steps: [15000, 5000]
positive_class_weight: [1, 1]
negative_class_weight: [20, 20]
learning_rates: [0.001, 0.0002]
batch_size: 128

# SpecAugment on in phase 1, off in phase 2
time_mask_max_size: [10, 0]
time_mask_count: [2, 0]
freq_mask_max_size: [6, 0]
freq_mask_count: [2, 0]

eval_step_interval: 500
clip_duration_ms: 1500

target_minimization: 0.9
minimization_metric: null
maximization_metric: "average_viable_recall"
